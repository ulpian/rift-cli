[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace meta-checks (crate-graph topology, toolchain pin, lint/package inheritance) run under `cargo test`."
publish = false

[lints]
workspace = true

[dependencies]
toml = { workspace = true }
serde_json = { workspace = true }
# The savings calibration writes one scratch checkout's serving overlay with
# every read lever off, and edits that document rather than replacing it.
toml_edit = { workspace = true }
# Owner-only release tooling; none of these enter the shipped CLI graph.
tempfile = { workspace = true }
sha2 = { workspace = true }
flate2 = "1"
tar = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
portable-pty = "0.9"
vt100 = "0.15"
# `replay-savings` replays recorded transcripts through the SHIPPED recogniser
# and the SHIPPED decision rather than a second opinion about either, so the
# harness reflects whatever grammar the checkout it is built from has. All four
# are leaves of the graph from here: nothing depends on xtask.
rift-agent = { version = "1.0.0-alpha", path = "../crates/rift-agent" }
rift-agent-claude-code = { version = "1.0.0-alpha", path = "../crates/rift-agent-claude-code" }
rift-core = { version = "1.0.0-alpha", path = "../crates/rift-core" }
rift-recall-validity = { version = "1.0.0-alpha", path = "../crates/rift-recall-validity" }
rift-tokens = { version = "1.0.0-alpha", path = "../crates/rift-tokens" }

[dev-dependencies]
# Committed crate-graph adjacency snapshot.
insta = { workspace = true }
# The off arm's policy is asserted through the loader that actually reads it,
# rather than through the bytes the harness wrote (dev-only).
rift-recall-policy = { version = "1.0.0-alpha", path = "../crates/rift-recall-policy" }
# The structure share of the list-shaped pull answers is measured on the
# answers the real dispatcher ships, over the eval harness's own corpus seeded
# into an in-memory projection, so the figure moves when a payload's shape
# does (dev-only: the crate graph counts normal dependencies).
rift-config = { version = "1.0.0-alpha", path = "../crates/rift-config" }
rift-recall-eval = { version = "1.0.0-alpha", path = "../crates/rift-recall-eval" }
rift-recall-ledger = { version = "1.0.0-alpha", path = "../crates/rift-recall-ledger" }
rift-recall-serve = { version = "1.0.0-alpha", path = "../crates/rift-recall-serve" }
rift-recall-substrate = { version = "1.0.0-alpha", path = "../crates/rift-recall-substrate" }
rift-recall-types = { version = "1.0.0-alpha", path = "../crates/rift-recall-types" }
rift-store = { version = "1.0.0-alpha", path = "../crates/rift-store" }
tokio = { workspace = true }
