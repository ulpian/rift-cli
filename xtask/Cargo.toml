[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace meta-checks (crate-graph topology, toolchain pin, lint/package inheritance) run under `cargo test`."
publish = false

[lints]
workspace = true

[dependencies]
toml = { workspace = true }
tempfile = { workspace = true }
rift-store = { version = "0.0.1", path = "../crates/rift-store" }
tokio = { workspace = true }
rift-core = { version = "0.0.1", path = "../crates/rift-core" }
rift-hashchain = { version = "0.0.1", path = "../crates/rift-hashchain" }
serde_json = { workspace = true }
# The scripted pin-cut (`xtask pin-cut`) reuses the wrapper's own fetch/extract
# path so the pin is derived exactly the way production provisioning verifies it.
rift-shadow-entire = { path = "../crates/rift-shadow-entire", features = ["provision-http"] }

[dev-dependencies]
# Committed crate-graph adjacency snapshot (step-01 exit criterion).
insta = { workspace = true }
