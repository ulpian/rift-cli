[package]
name = "rift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rift CLI + TUI entrypoint. Bare `rift` launches Canopy; subcommands drive rift-shadow."

[lints]
workspace = true

[[bin]]
name = "rift"
path = "src/main.rs"

[features]
# Default build launches the interactive Canopy TUI (xre terminal backend).
# `--no-default-features` yields an ASCII-only, dependency-light binary that
# still runs the subcommands and the headless one-frame dashboard.
default = ["tui", "provision-http"]
tui = ["rift-canopy/xre"]
# Real capture-backend download + extract for `rift setup` (P1 B2) — ON by default
# so `rift setup` provisions the backend from the upstream GitHub releases. A
# `--no-default-features` build (or `rift setup --no-provision` / `RIFT_NO_PROVISION`)
# skips it for offline/CI use; tests set `RIFT_NO_PROVISION` to stay network-free.
provision-http = ["rift-shadow/provision-http"]

[dependencies]
rift-core = { version = "0.0.1", path = "../../crates/rift-core" }
rift-shadow = { version = "0.0.1", path = "../../crates/rift-shadow" }
rift-canopy = { version = "0.0.1", path = "../../crates/rift-canopy" }
# The dashboard's data plane (ADR-0009): the bus, poller, and UI-facts store
# the binary wires into the live loop.
rift-canopy-data = { version = "0.0.1", path = "../../crates/rift-canopy-data" }
rift-registry = { version = "0.0.1", path = "../../crates/rift-registry" }
# The dashboard's column-2 detail reads a project's effective policy (sensitive
# path count, capture toggles) to summarize its settings (P5 S1).
rift-config = { version = "0.0.1", path = "../../crates/rift-config" }
# `rift verify` re-derives a hash chain and cross-checks it against the projection.
# `keyring`: OS-keychain custody for the identity install-salt + envelope KEK.
rift-store = { version = "0.0.1", path = "../../crates/rift-store", features = ["keyring"] }
# Per-install identity salt is minted from the OS CSPRNG.
getrandom = { workspace = true }
rift-hashchain = { version = "0.0.1", path = "../../crates/rift-hashchain" }
# `rift verify` drives the async store seam on a short-lived current-thread runtime.
tokio = { workspace = true }
# `rift hooks <agent> <verb>` parses the stdin-JSON capture contract.
serde_json = { workspace = true }
# The command-line surface (P8 S1): clap-derive tree, exit codes, --json contract.
clap = { workspace = true }
# Structured, redaction-safe diagnostics on stderr (05 section 5.7); RIFT_LOG opt-in.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `rift enable/disable` and the projection-read query commands need the agent SDK
# (verb lists / compat notes) and the recall substrate (checkpoint listing).
rift-agent = { version = "0.0.1", path = "../../crates/rift-agent" }
# Worktree discovery + the gix blob-read seam drive live commit diff-capture (P4 B3).
rift-git = { version = "0.0.1", path = "../../crates/rift-git" }
# `rift verify` re-derives the chain from the git-authoritative checkpoint branch
# (`rift/checkpoints/v1`) through the read-only gix substrate reader (P5 S4).
rift-recall-substrate = { version = "0.0.1", path = "../../crates/rift-recall-substrate" }
# `rift memory` (PRD-M2) reuses the recall server's library dispatch — the same
# envelopes, budgets, and policy gates as the MCP tools — over recall.db.
rift-recall-ledger = { version = "0.0.1", path = "../../crates/rift-recall-ledger" }
rift-recall-mcp = { version = "0.0.1", path = "../../crates/rift-recall-mcp" }
rift-recall-policy = { version = "0.0.1", path = "../../crates/rift-recall-policy" }
rift-recall-types = { version = "0.0.1", path = "../../crates/rift-recall-types" }
# Tokenizer provenance printed on the reread report (ADR-0006).
rift-tokens = { version = "0.0.1", path = "../../crates/rift-tokens" }

[dev-dependencies]
tempfile = { workspace = true }
