[package]
name = "rift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rift CLI + TUI entrypoint. Bare `rift` launches Canopy; subcommands drive rift-shadow."

[lints]
workspace = true

[[bin]]
name = "rift"
path = "src/main.rs"

[features]
# Default build launches the interactive Canopy TUI (xre terminal backend).
# `--no-default-features` yields an ASCII-only, dependency-light binary that
# still runs the subcommands and the headless one-frame dashboard.
default = ["tui"]
tui = ["rift-canopy/xre"]

[dependencies]
rift-core = { version = "0.0.1", path = "../../crates/rift-core" }
rift-shadow = { version = "0.0.1", path = "../../crates/rift-shadow" }
rift-canopy = { version = "0.0.1", path = "../../crates/rift-canopy" }
rift-registry = { version = "0.0.1", path = "../../crates/rift-registry" }
# `rift verify` re-derives a hash chain and cross-checks it against the projection.
rift-store = { version = "0.0.1", path = "../../crates/rift-store" }
rift-hashchain = { version = "0.0.1", path = "../../crates/rift-hashchain" }
# Enable at implementation: clap, tracing, tracing-subscriber, tokio

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
