[package]
name = "rift-memd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rift-total-recall binary: ingest | rebuild | doctor | diff-since | serve --mcp."

[lints]
workspace = true

[[bin]]
name = "rift-memd"
path = "src/main.rs"

[dependencies]
rift-core = { version = "0.0.1", path = "../../crates/rift-core" }
rift-recall-ledger = { version = "0.0.1", path = "../../crates/rift-recall-ledger" }
rift-recall-mcp = { version = "0.0.1", path = "../../crates/rift-recall-mcp" }
rift-recall-events = { version = "0.0.1", path = "../../crates/rift-recall-events" }
rift-recall-policy = { version = "0.0.1", path = "../../crates/rift-recall-policy" }
rift-recall-substrate = { version = "0.0.1", path = "../../crates/rift-recall-substrate" }
rift-recall-types = { version = "0.0.1", path = "../../crates/rift-recall-types" }
rift-config = { version = "0.0.1", path = "../../crates/rift-config" }
# The recall.db projection (separate from the M1 capture projection.db).
rift-store = { version = "0.0.1", path = "../../crates/rift-store" }
clap = { workspace = true }
# Structured, redaction-safe diagnostics on stderr (05 section 5.7); RIFT_LOG opt-in.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The graph ingest/metrics seam is async; the daemon drives it on a runtime.
tokio = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The agent-spawned stdio MCP transport (process lifetime = session).
rmcp = { workspace = true }
