# cargo-deny — supply-chain gate (run in CI). See build-plan stage-01 phase-02.
[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0173: `proc-macro-error2` is *unmaintained* (informational, not a
# vulnerability). It is an OPTIONAL, never-compiled transitive of `jiff` (jiff's
# `defmt` embedded-logging feature, which we do not enable); `jiff` itself enters
# legitimately via `gix-date`. Nothing we build links it. Re-evaluate if `jiff`
# drops the dep or a real vulnerability is filed. `cargo audit --deny warnings`
# carries the same ignore in `.cargo/audit.toml`.
# Tracking: https://rustsec.org/advisories/RUSTSEC-2026-0173 — re-check at each
# `jiff`/`gix` upgrade (next scheduled dependency review), remove when clear.
#
# NOTE (P3 review): when the deferred `turso` dependency is wired back (see
# phase-03 SPIKE-RESULTS.md), it pulls advisory-bearing transitives that must be
# ignored HERE and in `.cargo/audit.toml` (they reach the lockfile only via that
# optional, default-off feature): RUSTSEC-2026-0183 / -0184 (`git2` unsound — a
# build-dep of turso's `built`; unsound APIs never called) and RUSTSEC-2024-0436
# (`paste` unmaintained — a `turso_core` proc-macro).
ignore = ["RUSTSEC-2026-0173"]

[bans]
multiple-versions = "warn"
wildcards = "deny"          # no wildcard version reqs in our own manifests
allow = []
deny = [
  { name = "openssl-sys" }, # prefer rustls; avoid system OpenSSL
]

[licenses]
version = 2
# Permissive licenses only in the blanket allow (step-02: copyleft is handled
# via annotated per-crate exceptions, never by widening this list).
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
exceptions = [
  # `webpki-roots` ships the Mozilla CA-certificate *data* set under the Community
  # Data License Agreement – Permissive 2.0 (a permissive *data* license, not code).
  # It is pulled by `ureq`'s rustls root store ONLY on the capture-backend download
  # path (P1 B2, the `provision-http` feature). Scoped to that one crate.
  { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
  # `uluru` (via `gix-pack`) is MPL-2.0 — weak, file-level copyleft acceptable for
  # a linked dependency; it imposes no obligation on our own source. Scoped so any
  # FUTURE MPL dependency is a conscious, reviewed addition rather than a silent pass.
  { name = "uluru", allow = ["MPL-2.0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
