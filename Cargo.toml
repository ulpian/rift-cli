# Rift — Cargo workspace (scaffold)
# Generated as part of the Rift build plan. Crate stubs are std-only so the
# workspace builds offline; the real third-party dependencies are pinned in
# [workspace.dependencies] below and referenced (commented) in each crate,
# ready to enable as implementation begins. See build-plan/ for the full plan.
[workspace]
resolver = "2"
members = [
  "crates/rift-core",
  "crates/rift-config",
  "crates/rift-crypto",
  "crates/rift-hashchain",
  "crates/rift-git",
  "crates/rift-store",
  "crates/rift-shadow",
  "crates/rift-shadow-entire",
  "crates/rift-shadow-hooks",
  "crates/rift-shadow-attribution",
  "crates/rift-shadow-redact",
  "crates/rift-shadow-cost",
  "crates/rift-agent",
  "crates/rift-agent-claude-code",
  "crates/rift-agent-codex",
  "crates/rift-agent-gemini",
  "crates/rift-agent-cursor",
  "crates/rift-agent-copilot",
  "crates/rift-agent-opencode",
  "crates/rift-agent-factory-droid",
  "crates/rift-agent-ollama",
  "crates/rift-recall-types",
  "crates/rift-recall-substrate",
  "crates/rift-recall-ledger",
  "crates/rift-recall-validity",
  "crates/rift-recall-rank",
  "crates/rift-recall-pack",
  "crates/rift-recall-policy",
  "crates/rift-recall-mcp",
  "crates/rift-recall-events",
  "crates/rift-recall-eval",
  "crates/rift-tokens",
  "crates/rift-canopy",
  "crates/rift-registry",
  "crates/rift-fff",
  "crates/rift-codegraph",
  "crates/rift-nic-gauge",
  "bins/rift",
  "bins/rift-memd",
  "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/ulpian/rift"
authors = ["Ulpian Morina"]

# ---------------------------------------------------------------------------
# Pinned external dependencies (single source of truth).
# Versions marked (verify) should be re-checked against crates.io at the moment
# the crate is first wired in; turso is BETA and pre-1.0.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Storage — Turso (SQLite-compatible Rust rewrite: MVCC, async, native vectors).
# DEFERRED (P3 review): pin kept for the eventual wiring, but NO crate references
# it (so it stays out of Cargo.lock). The P3 spike found turso 0.1.5 lacks CREATE
# TRIGGER / STRICT / encryption, and pulling it in adds advisory-bearing git2 +
# paste. Re-review before adding `turso = { workspace = true }` to any crate. See
# phase-03-turso-storage-foundation/SPIKE-RESULTS.md.
turso = "0.1"                  # (verify) BETA; deferred — see SPIKE-RESULTS.md
# Reference store for the testable vertical slice: SQLite-compatible, synchronous,
# runs the SAME SQL/triggers Turso will. Production target stays `turso` behind the seam.
rusqlite = { version = "0.32", features = ["bundled"] }   # (verify) needs a C compiler (bundled SQLite)
# TUI / 3D render engine (first-party)
# xRenderEngine (xre) 0.2 — depend on the terminal + 2D TUI layers directly, NOT the
# `xre-rs` facade: the facade pulls xre-engine (ECS), xre-render (software 3D) and
# xre-cello (scene/OBJ) as non-optional deps, which a 2D dashboard does not need.
# `default-features = false` on xre-tui drops its `render` (Viewport3D) + `parallel`
# (rayon) defaults, leaving just crossterm + glam + unicode-width.
xre-core = { version = "0.2", default-features = false }
xre-term = { version = "0.2", default-features = false }
xre-tui = { version = "0.2", default-features = false }
# MCP server SDK (official)
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] } # (verify)
# Git plumbing (pure-Rust, read-side). Pinned high enough to clear RUSTSEC-2025-0001
# (gix-worktree-state ≥0.17), -2025-0021 (gix-features ≥0.41), and -2025-0140
# (gix-date ≥0.12); we use only the read-side surface (open/Tree/ObjectId), so the
# bump is API-stable.
gix = "0.78"                   # gitoxide
# Diff / hunks
imara-diff = "0.1"             # (verify)
# Hashing
blake3 = "1"
sha2 = "0.10"
# Git blob object id (SHA-1 loose-object framing) for the content→blob-oid map
# (ADR-0005). Already vendored transitively via gix, so this adds no new tree.
sha1 = "0.10"
# Symbols (Phase 7 dependency-aware expansion)
tree-sitter = "0.24"           # (verify)
# Tokenization (budget enforcement within ~5% of billing tokenizers)
tiktoken-rs = "0.6"            # (verify)
# Optional packages
fff-search = "0.1"             # (verify) dmtrKovalenko/fff core
codegraph = "0.2"              # anvanster/codegraph graph DB
# In-memory graph working set
petgraph = "0.6"
# Async / parallel
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
# Async trait objects for the storage seam (Store/StoreConn). Object-safe `&dyn
# Store` is required by the spec; native async-in-trait is not object-safe at the
# 1.94 MSRV, so the seam uses async-trait (the Turso engine plugs in behind it).
async-trait = "0.1"
rayon = "1"
# CLI / errors / logging
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Redaction (linear-time, no backreferences → ReDoS-safe)
regex = "1"
# HTTP(S) client for the capture-backend download (P1 B2). Referenced ONLY by
# `rift-shadow-entire`'s `provision-http` feature. rustls (ring provider) — NOT
# native-tls, so no banned `openssl-sys` on Linux. The download is the wrapper's
# ONLY network call and is fail-closed by SHA-256 against the pinned manifest.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Release-archive extraction for the capture-backend download (P1 B2). Behind the
# same `provision-http` feature. Pure-Rust decoders (no C, no openssl): flate2 +
# tar for the `*.tar.gz` (unix) assets, zip (deflate only) for the `*.zip` (windows)
# assets. The extracted binary is verified by SHA-256 before it is ever executable.
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Security / secrets hygiene
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"                  # envelope-key derivation (HKDF-SHA256)
getrandom = "0.2"             # OS CSPRNG for keys/nonces (no rand_core version dance)
# OS keychain (optional `keyring` feature in rift-store). Native backends only
# (no dbus/secret-service) so it compiles on headless CI across all three OSes:
# Security.framework (macOS), Credential Manager (Windows), kernel keyutils (Linux).
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "linux-native",
] }
# Testing
insta = "1"
proptest = "1"
criterion = "0.5"
tempfile = "3"               # on-disk fixtures for the gix substrate reader (dev-only)

# ---------------------------------------------------------------------------
# Workspace-wide lints. Security posture: deny unsafe by default (crates that
# must use FFI override locally with #![allow(unsafe_code)] + justification).
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# Groups get a lower priority than the individual lints below, so a specific
# lint always wins over its group (and silences the "same priority" warning).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Security-relevant lints stay on (a panic in a hook must not abort a git op).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
# No un-audited `a[i]` that can panic (05 §5.4: a panic in a hook must not
# abort the developer's git op). Sites indexing by construction-checked bounds
# (fixed-size arrays, length-checked ranges, `chunks_exact`) carry a narrow,
# justified `#[allow]` instead of a global downgrade.
indexing_slicing = "warn"
# Purely-stylistic pedantic lints we accept project-wide (not correctness or
# security): intentional numeric casts for display/estimates, closures after
# statements, broad-but-deliberate signatures, exact float comparisons in tests.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
items_after_statements = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
match_wildcard_for_single_variants = "allow"
ref_option = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
should_implement_trait = "allow"
format_push_string = "allow"
float_cmp = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
panic = "unwind"
