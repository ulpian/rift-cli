# --------------------------------------------------------------------------
[[floor]]
scenario = "enable-displacement"
kind = "latency"
status = "owner-ratified"
work_unit = ""
budget_ms = 100
machine_class = "macos / x86_64 / 8 logical CPUs"
protocol = "3 warmup + 11 measured commits per arm, both orders measured in the same run against a bare-commit control"
caps = "MAX_TOTAL_BYTES=8192; MAX_FILE_BYTES=4096"
measured_paths = ["bins/rift/src/main.rs", "bins/rift/src/hooks/", "crates/rift-shadow-hooks/src/lib.rs", "crates/rift-store/src/migrate.rs", "benches/native-baseline/src/displace.rs"]
derivation_medians = []
derivation_artifacts = []
derivation = "NOT a derived floor, and never was. This scenario is a paired LATENCY displacement measure and is NEVER a throughput floor: an enable that does more work per second is not thereby better, and a commit that takes longer is not thereby doing more. Its bar is the owner's — 100 ms of git latency, HARD — and an owner's bar is ruled, not derived from medians."
note = "The claim under test is DISPLACEMENT, not speed: projection init was moved to `rift enable` time by an owner decision, so the cost must appear at enable and be ABSENT from the first commit. Two orders in one run — enable-then-commit vs commit-without-prior-enable — because a single order cannot tell a cost that moved from a cost that vanished. The first-commit arm is the one held to the 100 ms budget."
