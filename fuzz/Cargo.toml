# cargo-fuzz package — a SEPARATE workspace (own [workspace] table) so the main
# `cargo build/test --workspace` on stable never tries to build it; it needs a
# nightly toolchain + libFuzzer. Run with: `cargo +nightly fuzz run config_parse`.
[package]
name = "rift-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.94"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rift-config = { path = "../crates/rift-config", version = "0.0.1" }
rift-core = { path = "../crates/rift-core", version = "0.0.1" }
rift-shadow-redact = { path = "../crates/rift-shadow-redact", version = "0.0.1" }
rift-shadow-attribution = { path = "../crates/rift-shadow-attribution", version = "0.0.1" }
rift-shadow-hooks = { path = "../crates/rift-shadow-hooks", version = "0.0.1" }
rift-recall-substrate = { path = "../crates/rift-recall-substrate", version = "0.0.1", default-features = false }
rift-recall-mcp = { path = "../crates/rift-recall-mcp", version = "0.0.1" }
rift-canopy = { path = "../crates/rift-canopy", version = "0.0.1", default-features = false }
serde_json = "1"

# Untrusted-byte parsers get a fuzz target as they land (06 §6.1 / §5.9).
# Still pending: fff_query (Stage 5 P2).
[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "run_hook"
path = "fuzz_targets/run_hook.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redact"
path = "fuzz_targets/redact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff"
path = "fuzz_targets/diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glob_match"
path = "fuzz_targets/glob_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_artifact"
path = "fuzz_targets/checkpoint_artifact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_request"
path = "fuzz_targets/mcp_request.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "palette_parse"
path = "fuzz_targets/palette_parse.rs"
test = false
doc = false
bench = false
