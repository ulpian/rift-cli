name: fuzz-nightly
# Long-budget coverage-guided fuzzing: 10 minutes per target, weekly.
# Daily/manual CI runs the 60s smoke in ci.yml; this run goes deep and uploads any crash
# artifacts + the grown corpus for triage.
on:
  schedule:
    - cron: "17 3 * * 0" # weekly, off-peak
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-long-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz-long:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            config_parse,
            run_hook,
            redact,
            redact_jsonl,
            redact_fallback,
            fuzz_pack_load,
            diff,
            glob_match,
            checkpoint_artifact,
            mcp_request,
            palette_parse,
            search_query,
            shell_read,
            shell_read_bash,
            doc_convert,
          ]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "fuzz" }
      - run: cargo install cargo-fuzz --locked
      - name: fuzz ${{ matrix.target }} for 10 minutes
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600 -timeout=25
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
