name: Alpha release packages

on:
  workflow_dispatch:
  push:
    branches: ['release/**']
    tags: ['v1.0.0-alpha*']

permissions:
  contents: read

concurrency:
  group: alpha-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: alpha-${{ matrix.target }}
      - name: Build the shipped CLI
        run: cargo build --locked --release -p rift --target ${{ matrix.target }}
      - name: Verify and package the native executable
        run: python release/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: rift-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  bundle:
    name: Collect release archives and checksums
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: rift-*
          path: dist
          merge-multiple: true
      - name: Verify the version and produce checksums
        run: |
          python release/package.py --checksums
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$(tr -d '\r\n' < release/alpha-version)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rift-release-bundle
          path: |
            dist/*
            install.sh
            install.ps1
            release/NOTES.md
            release/notes/*.md
          if-no-files-found: error
