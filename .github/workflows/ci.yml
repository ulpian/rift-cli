name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release
  # Proves the declared MSRV floor (rust-version = 1.94) actually compiles, even
  # though the dev/build toolchain is pinned to 1.96.0 (rust-toolchain.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features
  # Coverage as a gate, not a dashboard: ≥85% line workspace-wide, plus ≥95% for
  # the security-critical crates (ci/security-crates.txt) enforced by xtask.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with: { components: "llvm-tools-preview" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      # Run the instrumented suite once; render reports from the same data.
      - run: cargo llvm-cov --workspace --all-features --no-report
      # keychain_os.rs is an untestable OS-I/O boundary (real-keychain only) — excluded.
      - run: cargo llvm-cov report --lcov --output-path lcov.info --fail-under-lines 85 --ignore-filename-regex 'keychain_os\.rs'
      - run: cargo llvm-cov report --json --output-path cov.json --ignore-filename-regex 'keychain_os\.rs'
      - run: cargo run -p xtask -- check-coverage cov.json   # per-crate ≥95% gate
      - uses: actions/upload-artifact@v4
        with: { name: coverage-lcov, path: lcov.info }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny cargo-audit --locked
      - run: cargo deny check
      - run: cargo audit --deny warnings   # honours .cargo/audit.toml ignores
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # @nightly auto-selects the latest nightly that actually carries the
      # requested components (robust — a hardcoded `nightly-YYYY-MM-DD` is not a
      # valid dtolnay/rust-toolchain ref and may lack miri); scoped to the
      # FFI-bearing crates.
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: "miri, rust-src" }
      # Advisory (|| true) until the FFI seams carry `unsafe` to certify UB-free.
      - run: cargo +nightly miri test -p rift-canopy -p rift-fff || true
  # NOTE: a Turso advisory job was removed with the turso dependency (P3 review —
  # see phase-03 SPIKE-RESULTS.md). Restore it (clippy + test `-p rift-store
  # --features turso`, continue-on-error) if/when the turso dep is wired back.
