# Built-in secret-detection rules, embedded into the binary via include_str!.
# Each rule is a (kind, pattern, confidence) triple. Patterns are Rust `regex`
# crate syntax. This is a starter set, not an exhaustive one — extend with org
# rule packs via `rift redact --pack <file.toml>`.

[[rules]]
kind = "aws_access_key_id"
pattern = "AKIA[0-9A-Z]{16}"
confidence = 0.95

[[rules]]
kind = "github_pat"
pattern = "ghp_[A-Za-z0-9]{36}"
confidence = 0.95

[[rules]]
kind = "github_fine_grained_pat"
pattern = "github_pat_[A-Za-z0-9_]{22,}"
confidence = 0.9

[[rules]]
kind = "slack_token"
pattern = "xox[baprs]-[A-Za-z0-9-]{10,}"
confidence = 0.9

[[rules]]
kind = "private_key_header"
pattern = "-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----"
confidence = 0.99

[[rules]]
kind = "jwt"
pattern = "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
confidence = 0.7

[[rules]]
kind = "credentialed_url"
pattern = "[a-zA-Z][a-zA-Z0-9+.-]*://[^/\\s:@]+:[^/\\s:@]+@"
confidence = 0.85
