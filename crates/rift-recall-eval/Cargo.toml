[package]
name = "rift-recall-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lost-in-Delta eval harness: deterministic replay, savings/non-degradation metrics, and the go/no-go gate they feed."

[lints]
workspace = true

[dependencies]
# The REAL serve surface under reconciliation: the delta condition
# drives the transport-independent dispatcher in-process — the same envelopes,
# budgets, policy gates, and audit events as `rift recall <verb>` — over a
# fixture store, so the emitted claim the harness reconciles is the serving
# side's own number, never the harness's arithmetic.
rift-config = { version = "1.1.0-alpha", path = "../rift-config" }
rift-core = { version = "1.1.0-alpha", path = "../rift-core" }
rift-recall-events = { version = "1.1.0-alpha", path = "../rift-recall-events" }
rift-recall-ledger = { version = "1.1.0-alpha", path = "../rift-recall-ledger" }
rift-recall-serve = { version = "1.1.0-alpha", path = "../rift-recall-serve" }
# The pack under test: the delta-served runs compile real packs.
rift-recall-pack = { version = "1.1.0-alpha", path = "../rift-recall-pack" }
rift-recall-policy = { version = "1.1.0-alpha", path = "../rift-recall-policy" }
rift-recall-substrate = { version = "1.1.0-alpha", path = "../rift-recall-substrate" }
rift-recall-types = { version = "1.1.0-alpha", path = "../rift-recall-types" }
rift-store = { version = "1.1.0-alpha", path = "../rift-store" }
# The one token-counting authority: measured savings use the same
# tokenizer the serving side reports, so reconciliation is apples-to-apples.
rift-tokens = { version = "1.1.0-alpha", path = "../rift-tokens" }
# The temporary repository the intercepted condition writes its policy into:
# the lever it measures is resolved from a real `.rift/policies/serve.toml`, and
# never from this repository's.
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The committed go/no-go report snapshot: the verdict's wording is reviewed on
# change, so a decision report cannot shift shape unnoticed.
insta = { workspace = true }
proptest = { workspace = true }
