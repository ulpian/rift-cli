# Serve-policy overlay (.rift/policies/serve.toml): TOML, deny_unknown_fields.
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
toml_edit = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
