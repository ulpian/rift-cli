[package]
name = "rift-canopy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rift-canopy TUI: 3-column dashboard, nic-gauge, slash-command palette, splash — behind a RenderBackend seam with an ASCII fallback."

[lints]
workspace = true

[features]
default = []
# The first-party xRenderEngine terminal + 2D TUI layers plug in behind the
# RenderBackend seam (live raw-mode loop, panels, widgets); the ASCII fallback is
# always available. We depend on the term/core/tui layers directly rather than
# the `xre-rs` facade, which would also pull the 3D engine + ECS + scene loader.
xre = ["dep:xre-core", "dep:xre-term", "dep:xre-tui"]
# Reserved (off by default): the Full3d splash tier. Re-enables xre-tui's `render`
# layer (which pulls the xre-render 3D engine). The deterministic crack/wordmark
# core + the 2D/ASCII tiers ship without it; this is the seam for the real
# voxel/mesh raster, plugged in later behind `render::xre_backend::render_scene`.
xre-3d = ["xre", "xre-tui/render"]
# Reserved (off by default): parallel rasterization (rayon) for the 3D raster.
parallel = ["xre", "xre-tui/parallel"]

[dependencies]
rift-core = { version = "0.0.1", path = "../rift-core" }
xre-core = { workspace = true, optional = true }
xre-term = { workspace = true, optional = true }
xre-tui = { workspace = true, optional = true }
# Splash preferences (seen_splash / mode / reduced_motion) persist as a global
# per-user TOML; the registry crate provides the config-dir resolver we reuse.
rift-registry = { version = "0.0.1", path = "../rift-registry" }
toml = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
