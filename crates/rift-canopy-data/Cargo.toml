[package]
name = "rift-canopy-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Canopy's data plane: the live bus and worker, the watermark poller, the append-only UI-facts store, the status/detail builders, and the graph feeds."

[lints]
workspace = true

[dependencies]
rift-core = { version = "1.3.0-alpha", path = "../rift-core" }
# The dashboard's shared event/snapshot types (the edge points THIS way only:
# rift-canopy never imports the data plane, so the render layer stays testable
# without a store).
rift-canopy = { version = "1.3.0-alpha", path = "../rift-canopy" }
# Read-only projection access + the append-only UI-facts store engine.
rift-store = { version = "1.3.0-alpha", path = "../rift-store" }
# The column-2 settings summary reads a project's effective policy.
rift-config = { version = "1.3.0-alpha", path = "../rift-config" }
rift-agent-install = { version = "1.3.0-alpha", path = "../rift-agent-install" }
rift-recall-policy = { version = "1.3.0-alpha", path = "../rift-recall-policy" }
# Repo identity (the projection scope key) + worktree plumbing.
rift-git = { version = "1.3.0-alpha", path = "../rift-git" }
# The family's binary of record — the note the git hook install leaves behind,
# read (never written) so a status can tell a set-up family from one that only
# has a projection. The edge points this way only: the capture hooks know
# nothing of the dashboard, so the graph stays acyclic.
rift-shadow-hooks = { version = "1.3.0-alpha", path = "../rift-shadow-hooks" }
# Canonical Git checkpoint/shadow readers and their lenient artifact types.
rift-recall-substrate = { version = "1.3.0-alpha", path = "../rift-recall-substrate" }
rift-recall-types = { version = "1.3.0-alpha", path = "../rift-recall-types" }
rift-shadow-attribution = { version = "1.3.0-alpha", path = "../rift-shadow-attribution" }
# Scope parser only. Colours remain owned by Canopy's active theme.
syntect = { workspace = true }
# The rift-store seam is async; reads run on short-lived current-thread runtimes.
tokio = { workspace = true }
# The gauge formula/bands/reference table live in rift-nic-gauge, their single
# owner; the Nic feed consumes them through the NicGauge trait.
rift-nic-gauge = { version = "1.3.0-alpha", path = "../rift-nic-gauge" }
# The recall savings % is the ledger's guarded ratio — one function, so the
# dashboard and the reports cannot drift apart.
rift-recall-ledger = { version = "1.3.0-alpha", path = "../rift-recall-ledger" }
# The one money authority: avoided-token valuation, the
# largest-remainder partition, and the ~$ / $ formatters. The render layer
# receives finished figures and labels; money math never leaves this seam.
rift-shadow-cost = { version = "1.3.0-alpha", path = "../rift-shadow-cost" }
# fs-notify as a wake-signal only; failure degrades to PollOnly.
notify = { workspace = true }
# The lenient local session-cache parser. The contract is mirrored here rather
# than imported: the data plane must not depend on the capture hooks.
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# The one fixture builder for a repository shape: a `.git` these
# tests build by hand is a shape hardened discovery refuses. Feature-gated, so
# the dev-only edge adds nothing to the shipped graph.
rift-git = { version = "1.3.0-alpha", path = "../rift-git", features = ["test-support"] }
