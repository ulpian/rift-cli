[package]
name = "rift-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Loads the committed .rift/ config & policies into typed, validated policy-as-code."

[lints]
workspace = true

[dependencies]
rift-core = { version = "1.0.0-alpha", path = "../rift-core" }
serde = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
# Redactor rule packs ship as TOML or JSON; both parsers are already pinned.
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Contract snapshots: representative EffectiveConfig + aggregated error report.
insta = { workspace = true }
# Symlinked/linked-directory policy-file guard needs real on-disk fixtures.
tempfile = { workspace = true }
