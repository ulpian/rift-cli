[package]
name = "rift-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native git plumbing (P7 S3): worktree/common-dir discovery, additive object writes behind a RedactedBytes type wall, and the argv-safe shell-out to `git` for reset/checkout."

[lints]
workspace = true

[features]
# The gix-backed read seam (`GixBlobReader`) ships by default (builds offline),
# but lives behind a feature so `--no-default-features` still builds the write
# side + worktree discovery + the in-memory `MemoryBlobReader` with no gix.
default = ["gix"]
gix = ["dep:gix"]

[dependencies]
rift-core = { version = "0.0.1", path = "../rift-core" }
sha2 = { workspace = true }
# Transient machine-fingerprint hygiene (identity.rs): wiped after hashing.
zeroize = { workspace = true }
# Read-side git object access (blobs/trees) for diff-capture (P4 B3). We use only
# the read surface (open/Tree/ObjectId), matching the workspace gix audit rationale.
gix = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# Construct a RedactedBytes via the sanctioned redaction gate (its sole constructor).
rift-shadow-redact = { version = "0.0.1", path = "../rift-shadow-redact" }
